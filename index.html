<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUESTIA | الفخامة في العمل الحر</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="gate-body">

    <div class="luxury-container">
        <div class="brand-section">
            <div class="logo-outer-glow">
                <img src="logo.jpg" alt="Questia" class="central-logo">
            </div>
            <h1 class="glitter-text">QUESTIA</h1>
            <p class="sub-text">بوابتك لعالم الكويستات الاحترافية</p>
        </div>

        <div class="choices-grid">
            <a href="player-setup.html" class="glass-btn player-gate">
                <div class="btn-content">
                    <span class="btn-icon">⚔️</span>
                    <h3>ساحة الأبطال</h3>
                    <p>ارتقِ برتبتك واكسب الكاش</p>
                </div>
            </a>

            <a href="merchant-setup.html" class="glass-btn merchant-gate">
                <div class="btn-content">
                    <span class="btn-icon">💼</span>
                    <h3>مركز الأعمال</h3>
                    <p>وظف النخبة وأدر كويستاتك</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
